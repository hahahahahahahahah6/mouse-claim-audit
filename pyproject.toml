[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-claim-audit"
version = "0.1.0"
description = "Offline audit of documented synthetic pointer input"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
mouse-claim-audit = "mouse_claim_audit:main"

[tool.setuptools.packages.find]
include = ["mouse_claim_audit*"]
